# Home Assistant integration quality scale.
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
#
# Custom integrations are not scored on home-assistant.io (they sit in the
# "Custom" special tier). This file tracks the same rules so a Core submission
# — or a reviewer — can see what is done, what is exempt, and what is left.
rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands:
    status: done
    comment: >
      custom_components/carnet_scolaire/brand/ ships icon.png, icon@2x.png,
      logo.png and logo@2x.png, tracked in the repository.
  common-modules: done
  config-flow:
    status: done
    comment: >
      Every field of every config and options step carries a data_description,
      written in scripts/build_translations.py.
  config-flow-test-coverage:
    status: done
    comment: >
      tests/test_config_flow.py recovers from an error to CREATE_ENTRY in each
      mode (credentials, ENT, QR code, EcoleDirecte) and aborts a duplicate
      with already_configured for both PRONOTE and EcoleDirecte.
  dependency-transparency: done
  docs-actions: done
  docs-conditions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: todo
    comment: >
      Service failures are not yet all mapped to ServiceValidationError
      (bad input) or HomeAssistantError (server or limiter refusal). Being
      fixed separately.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters:
    status: todo
    comment: >
      The user guide does not yet describe each field of each config-flow step
      (address, login mode, ENT, QR code, EcoleDirecte QCM, children). Being
      fixed separately.
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: >
      Cloud polling of a school PRONOTE portal; there is no local discovery
      signal (mDNS, DHCP, SSDP).
  discovery-update-info:
    status: exempt
    comment: No discovery, so there is no discovery payload to refresh.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations:
    status: todo
    comment: >
      Limitations are scattered across the guide and the specification; there
      is no single section stating them (e.g. a parent account cannot tick
      homework, EcoleDirecte offers no write, child identifiers rotate).
  docs-supported-devices:
    status: todo
    comment: >
      The docs do not state in one place which platforms, account types
      (parent, pupil) and login modes are supported, nor what each source
      (PRONOTE, EcoleDirecte) lacks.
  docs-supported-functions:
    status: todo
    comment: >
      The entity catalogue (annexe A) lists PRONOTE entities but does not say
      which ones EcoleDirecte provides, so the functions a user gets depend on
      a source the docs do not map.
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: todo
    comment: >
      List sensors (week timetable, grades, discussions, …) and per-period
      history are enabled by default; they are noisy for the recorder.
  entity-translations: done
  exception-translations:
    status: todo
    comment: >
      services.py raises with translation keys, but device_condition.py
      raises a plain-text HomeAssistantError, and __init__.py raises
      ConfigEntryNotReady / ConfigEntryAuthFailed with str(error) instead of
      a translation_key.
  icon-translations:
    status: todo
    comment: No icons.json yet.
  reconfiguration-flow:
    status: todo
    comment: >
      Options and reauth exist; there is no async_step_reconfigure to change
      the URL or ENT without removing the entry.
  repair-issues: done
  stale-devices:
    status: done
    comment: >
      async_remove_config_entry_device lets the user delete a superseded
      child device by hand. Automatic removal is deliberately not done:
      PRONOTE child identifiers rotate per session, so a child that looks
      gone may simply have a new identifier, and removing its device would
      drop its entities and history.

  # Platinum
  async-dependency:
    status: todo
    comment: >
      pronotepy is synchronous (requests). Wrapping it in an executor does
      not satisfy this rule, which has no exemption.
  inject-websession:
    status: todo
    comment: >
      Depends on an asyncio HTTP client. pronotepy does not accept an
      aiohttp or httpx session.
  strict-typing: done
