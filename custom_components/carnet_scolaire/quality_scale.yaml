# Home Assistant integration quality scale.
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
#
# Custom integrations are not scored on home-assistant.io (they sit in the
# "Custom" special tier). This file tracks the same rules so a Core submission
# — or a reviewer — can see what is done, what is exempt, and what is left.
rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands:
    status: done
    comment: >
      custom_components/carnet_scolaire/brand/ ships icon.png, icon@2x.png,
      logo.png and logo@2x.png, tracked in the repository.
  common-modules: done
  config-flow:
    status: done
    comment: >
      Every field of every config and options step carries a data_description,
      written in scripts/build_translations.py.
  config-flow-test-coverage:
    status: done
    comment: >
      tests/test_config_flow.py recovers from an error to CREATE_ENTRY in each
      mode (credentials, ENT, QR code, EcoleDirecte) and aborts a duplicate
      with already_configured for both PRONOTE and EcoleDirecte.
  dependency-transparency: done
  docs-actions: done
  docs-conditions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: >
      Every service and the to-do tick reach the session through
      service_errors.async_run_gesture, which turns each session failure
      family into a translated HomeAssistantError with fixed text; bad input
      and unsupported sources raise a translated ServiceValidationError.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters:
    status: done
    comment: >
      docs/GUIDE-UTILISATEUR.md section 2 describes every field of the three
      PRONOTE modes and of the EcoleDirecte step, security question included.
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: >
      Cloud polling of a school PRONOTE portal; there is no local discovery
      signal (mDNS, DHCP, SSDP).
  discovery-update-info:
    status: exempt
    comment: No discovery, so there is no discovery payload to refresh.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations:
    status: done
    comment: >
      docs/GUIDE-UTILISATEUR.md section 15 "Limites connues" lists each
      limitation (PRONOTE, EcoleDirecte, both) with its cause and what the
      user can do.
  docs-supported-devices:
    status: done
    comment: >
      docs/GUIDE-UTILISATEUR.md section 13 "Ce qui est pris en charge" states
      the supported sources, PRONOTE spaces, account types, login modes and
      ENT portals, and what is not supported.
  docs-supported-functions:
    status: done
    comment: >
      docs/GUIDE-UTILISATEUR.md section 14 "Fonctions fournies, par source"
      maps entities, services and device automations to PRONOTE and
      EcoleDirecte, and links annexe A for the detail.
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: >
      The eight closed-period sensors (PronoteHistorySensor), which multiply
      through the year and are read rather than triggered on, are created
      disabled. List and diagnostic sensors stay enabled: blueprints, device
      automations or the dashboard cards read them. tests/test_sensor.py
      asserts the disabled set exactly.
  entity-translations: done
  exception-translations:
    status: done
    comment: >
      Every HomeAssistantError raised by the package (services, to-do, set-up
      ConfigEntryNotReady / ConfigEntryAuthFailed, device condition and
      trigger) names a translation_key; placeholders never carry exception
      text. tests/test_translations.py scans the source for any raise without
      one.
  icon-translations:
    status: done
    comment: >
      icons.json is generated by scripts/build_translations.py, with an icon
      per entity translation key (per-state for the limiter ENUM sensor and
      the binary sensors) and per service; tests/test_translations.py fails
      on an entity or service without one.
  reconfiguration-flow:
    status: todo
    comment: >
      Options and reauth exist; there is no async_step_reconfigure to change
      the URL or ENT without removing the entry.
  repair-issues: done
  stale-devices:
    status: done
    comment: >
      async_remove_config_entry_device lets the user delete a superseded
      child device by hand. Automatic removal is deliberately not done:
      PRONOTE child identifiers rotate per session, so a child that looks
      gone may simply have a new identifier, and removing its device would
      drop its entities and history.

  # Platinum
  async-dependency:
    status: todo
    comment: >
      pronotepy is synchronous (requests). Wrapping it in an executor does
      not satisfy this rule, which has no exemption.
  inject-websession:
    status: todo
    comment: >
      Depends on an asyncio HTTP client. pronotepy does not accept an
      aiohttp or httpx session.
  strict-typing: done
