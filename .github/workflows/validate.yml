name: Validate

on:
  pull_request:
  push:
    branches: [main]
  # So the gates can be asked for on a branch explicitly. `pronotepy-watch.yml`
  # needs this: GitHub does not start workflows from events produced by
  # `GITHUB_TOKEN`, so the pull request that job opens to raise the pronotepy
  # pin would carry no checks at all -- and an unchecked bump proposal is worth
  # less than no proposal. `workflow_dispatch` is the documented exception.
  workflow_dispatch:

# No repository secret is required by this workflow (SPECIFICATION.md §11.1).
permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # 3.14, not a preference: `pytest-homeassistant-custom-component`
          # requires >= 3.14 from 0.13.317 on, and the pin in
          # requirements_test.txt is the Home Assistant floor declared in
          # hacs.json. A 3.13 runner cannot install the test stack at all.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy --strict
        run: mypy --strict custom_components/carnet_scolaire

  test:
    name: Tests (HA ${{ matrix.ha-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The pinned baseline carries the coverage gate; the floating row
          # catches upstream breakage early without blocking on it.
          - ha-version: "2026.9"
            pytest-hacc: "0.13.363"
            gate: true
          - ha-version: "latest"
            pytest-hacc: ""
            gate: false
            # `fail-fast: false` only stops the other rows being cancelled; it
            # does not stop this one failing the workflow. Without this the
            # floating row gated every branch on upstream's next release,
            # which is the opposite of what the comment above promises.
            tolerate-failure: true
    continue-on-error: ${{ matrix.tolerate-failure || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # 3.14, not a preference: `pytest-homeassistant-custom-component`
          # requires >= 3.14 from 0.13.317 on, and the pin in
          # requirements_test.txt is the Home Assistant floor declared in
          # hacs.json. A 3.13 runner cannot install the test stack at all.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies (pinned)
        if: matrix.pytest-hacc != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Install dependencies (latest)
        if: matrix.pytest-hacc == ''
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          pip install --upgrade pytest-homeassistant-custom-component

      # The floor is a promise made to users by hacs.json, and `tests/
      # test_version_floor.py` only checks that the repository repeats the
      # number consistently. This is the step that checks the number is *true*:
      # that the pinned plugin release really carries the declared Home
      # Assistant. Nothing else can -- the mapping lives on PyPI, and a test
      # that fetched it would put the network in the suite.
      - name: The pinned row really installs the declared floor
        if: matrix.pytest-hacc != ''
        run: |
          python - <<'PY'
          import json, pathlib
          from homeassistant.const import __version__ as installed
          declared = json.loads(pathlib.Path("hacs.json").read_text())["homeassistant"]
          assert installed == declared, (
              f"hacs.json declares Home Assistant {declared}, but the pin in "
              f"requirements_test.txt installed {installed}: the floor is not "
              f"the socle being tested"
          )
          print(f"floor {declared} confirmed")
          PY

      # Only on the floating row, and tolerated like the rest of it. The `lint`
      # job type-checks against the *pinned floor*, which cannot see an API
      # that upstream removes later. The removal that motivated this step:
      # `DeviceInfo.via_device` still existed on 2026.8, the floor at the time,
      # and was gone on 2026.9 -- so a call using it type-checked clean while
      # failing on a user's instance, and it failed by refusing to add every
      # entity on the affected device, which no test can reproduce because the
      # deprecation is only escalated outside the test harness. Running mypy
      # against `latest` is what turns that class of removal into a warning
      # here instead of a bug report.
      - name: mypy --strict against the floating release
        if: matrix.pytest-hacc == ''
        continue-on-error: true
        run: mypy --strict custom_components/carnet_scolaire

      - name: pytest
        run: |
          pytest \
            --cov=custom_components/carnet_scolaire \
            --cov-branch \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Coverage gate (global 80 %, critical modules 100 %)
        if: matrix.gate
        run: python scripts/check_coverage.py coverage.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.ha-version }}
          path: coverage.xml
          if-no-files-found: ignore

  manifest:
    name: Manifest sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Kept in step with the other jobs of this workflow, though this one
          # installs nothing: `check_manifest.py` is standard library only.
          python-version: "3.14"

      - name: manifest.json carries no `loggers` key
        # SPECIFICATION.md §8.1: enabling the pronotepy logger at DEBUG writes
        # the request payload, credentials included. The requirement is only
        # worth anything if it is enforced.
        run: python scripts/check_manifest.py

  citations:
    name: Documentation citations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The drift check asks git when the cited file last moved relative
          # to when the document was last read. On the default shallow clone
          # every such question returns nothing, so the check would pass
          # without having run -- which is why `check_doc_citations.py`
          # refuses a shallow clone outright rather than reporting success.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Standard library only, like the manifest job; pinned to match.
          python-version: "3.14"

      - name: Work out which commits are under test
        id: range
        # What blocks is only the drift *these* commits caused; the rest is
        # reported as a backlog. That split needs a base commit, and each
        # event names it differently. A base that does not resolve is left
        # empty rather than guessed, and the check then reports without
        # blocking -- said out loud in the log, because a gate that quietly
        # stops gating is the failure this whole job exists to prevent.
        run: |
          set -euo pipefail
          base=""
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push)         base="${{ github.event.before }}" ;;
          esac
          if [ -n "$base" ] && git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            echo "since=$base" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify --quiet "HEAD~1^{commit}" >/dev/null; then
            echo "Base '$base' does not resolve; falling back to HEAD~1."
            echo "since=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No base commit resolves, so drift is reported but nothing blocks."
            echo "since=" >> "$GITHUB_OUTPUT"
          fi

      - name: Every cited source location exists and has not moved
        # The convention throughout `docs/` is that a claim about behaviour
        # cites the code implementing it. Nothing verified those citations
        # until now, and both ways they rot are invisible to review: a
        # refactor breaks them in bulk, and a commit to one file silently
        # invalidates a range cited for it in a document nobody touched.
        run: |
          python scripts/check_doc_citations.py \
            ${{ steps.range.outputs.since && format('--since={0}', steps.range.outputs.since) || '' }}
