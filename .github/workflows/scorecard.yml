name: OpenSSF Scorecard

# Supply-chain checks from the Open Source Security Foundation: branch
# protection, pinned actions, token permissions, dependency updates, and so on.
# `publish_results` sends the score to api.scorecard.dev, which serves the
# README badge; findings also land in the Security tab as SARIF.
#
# scorecard-action refuses to publish from a workflow whose job runs anything
# but approved actions, and from one granting write permissions at the top
# level: keep this file to those three steps.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
