name: Hassfest

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A superseded pull-request run is cancelled; a run on `main` always finishes.
concurrency:
  group: hassfest-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@9e9565e68f5a70d874202871f4c4064d23814235 # master
