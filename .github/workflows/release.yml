name: Release

on:
  push:
    tags:
      - "v*"

# Minimal permissions, declared in the workflow. This is the only workflow that
# uses the token GitHub Actions provides (SPECIFICATION.md §11.1). Read-only at
# the top, and `contents: write` granted to the one job that publishes, so a
# job added here later does not inherit it.
permissions:
  contents: read

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: manifest version must equal the tag
        # A HACS integration whose manifest diverges from the tag installs and
        # then never updates again (SPECIFICATION.md §11.1).
        run: python scripts/check_manifest.py --expect-version "${GITHUB_REF_NAME#v}"

      - name: Build the integration archive
        run: |
          cd custom_components/carnet_scolaire
          zip -r ../../carnet_scolaire.zip . -x '*__pycache__*' -x '*.pyc'

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: carnet_scolaire.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
