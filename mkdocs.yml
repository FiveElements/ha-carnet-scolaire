site_name: Carnet scolaire
site_description: >-
  Intégration Home Assistant pour PRONOTE et EcoleDirecte.
  Ordonnanceur multi-cadence, limiteur de débit débité à l'admission,
  et aucun secret dans un état d'entité.
site_url: https://fiveelements.github.io/ha-carnet-scolaire/
repo_url: https://github.com/FiveElements/ha-carnet-scolaire
repo_name: FiveElements/ha-carnet-scolaire
edit_uri: edit/main/docs/
copyright: MIT — Jérôme Morille

# The site is built from the same `docs/` tree the repository serves on GitHub,
# with no duplication and no generated copies. That is the whole point of
# docs-as-code here: a document is reviewed in the pull request that changes
# the code it describes, and `mkdocs build --strict` fails the build on a link
# that no longer resolves -- which is what actually keeps the two in step.
docs_dir: docs

theme:
  name: material
  # French, because every document is. This drives the search tokeniser and
  # every piece of theme furniture ("Table des matières", "Rechercher"...).
  language: fr
  logo: assets/logo.png
  favicon: assets/logo.png
  icon:
    repo: fontawesome/brands/github
  palette:
    # The visual identity is dark first -- deep black lit by neon gold and
    # emerald -- so the dark scheme is the default whatever the system says,
    # and the light one is a toggle away. Both are `custom`: the actual colours
    # live in assets/extra.css, as the identity's tokens, not as Material's
    # named hues, none of which is the brand's gold or emerald.
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Passer au thème clair
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passer au thème sombre
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    # The documents here are long, so the table of contents follows the reader
    # down the page.
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

nav:
  - Accueil: index.md
  - Guide de l'utilisateur: GUIDE-UTILISATEUR.md
  - Afficher les données: AFFICHER-LES-DONNEES.md
  - Les neuf blueprints: BLUEPRINTS.md
  - Exemples d'utilisation: EXEMPLES-BLUEPRINTS.md
  - "Migrer depuis pronote": MIGRATION-AUTOMATISATIONS.md
  - Architecture: ARCHITECTURE.md
  - Le limiteur et ses six états: LIMITEUR.md
  - Spécification:
      - Spécification: SPECIFICATION.md
      - Annexe A — entités et services: annexe-a-entites.md
      - Annexe B — limiteur de débit: annexe-b-rate-limit.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Lien vers cette section
      # GitHub's slugs, not Python-Markdown's: every document is read on
      # GitHub as well as here, and its links use GitHub anchors, accents
      # intact. The default slugifier strips accents, which breaks them.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        # Mermaid is rendered client-side by the theme, and natively by GitHub
        # from the same ```mermaid fences: one source, no duplicated diagram.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# A broken anchor is a warning rather than a note, so `mkdocs build --strict`
# fails on it: a link checker that does not fail the build is one nobody reads.
validation:
  anchors: warn
  links:
    unrecognized_links: warn

plugins:
  - search:
      lang: fr

# Une seule surcharge de style : le logo de la barre de titre, que le thème
# contraint à 24 px de haut. Chemin relatif à `docs_dir`.
extra_css:
  - assets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FiveElements/ha-carnet-scolaire
      name: Le dépôt
