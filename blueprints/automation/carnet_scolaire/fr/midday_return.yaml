# Retour du midi -- carnet_scolaire
#
# Ce qu'elle fait : exécute l'action de votre choix quand la matinée de l'élève
# se termine avant la pause du midi, et dit à quelle heure les cours reprennent.
#
# Sur quoi elle s'appuie : le capteur horodaté « Fin de matinée » (clé
# `morning_end`, `sensor.py:_morning_end`) est passé directement en `at:` d'un
# déclencheur `time` du cœur. Le capteur retire les cours annulés et les
# dispenses, et reconnaît une pause du midi avancée par une annulation : un
# jour où le dernier cours du matin saute parce que le professeur est absent,
# son état est l'heure où la matinée finit vraiment.
#
# L'option « Tenir compte des cours annulés » répond à la seule question que le
# capteur ne peut pas trancher : l'élève sort-il quand un professeur est
# absent, ou reste-t-il en permanence jusqu'à l'heure prévue ? Désactivée,
# l'automatisation attend l'attribut `scheduled_end`
# (`sensor.py:_morning_end_attributes`), la fin de matinée de la grille,
# annulations ignorées. Cet attribut vaut `None` quand la grille ne prévoyait
# aucune pause et que seules des annulations en ont ouvert une : ce jour-là,
# l'élève qui reste en permanence n'a pas de retour du midi, et rien ne se
# passe.
#
# Les jours sans pause du midi (journée continue, journée qui s'arrête à midi,
# week-end, vacances), le capteur vaut `unknown` : le déclencheur ne s'arme
# pas. Une journée qui s'arrête à midi relève de « Retour de l'école ».
#
# Home Assistant n'offre aucun mécanisme de traduction des blueprints : la
# version anglaise de ce même blueprint est ../en/midday_return.yaml. La
# duplication est assumée (docs/SPECIFICATION.md §10.9).

blueprint:
  name: PRONOTE - Retour du midi
  description: >-
    Exécute une action quand la matinée de l'élève se termine avant la pause
    du midi : notification, annonce vocale, ouverture du portail. L'heure vient
    du capteur « Fin de matinée », qui tient déjà compte des cours annulés et
    des dispenses. Une option dit si un cours annulé (professeur absent) avance
    le retour, ou si l'élève reste à l'école jusqu'à l'heure prévue.
    L'automatisation ne fait rien les jours sans pause du midi.
  domain: automation
  author: FiveElements
  homeassistant:
    min_version: 2026.10.0
  source_url: https://github.com/FiveElements/ha-carnet-scolaire/blob/main/blueprints/automation/carnet_scolaire/fr/midday_return.yaml
  input:
    eleve:
      name: Élève
      icon: mdi:account-school
      input:
        morning_end_sensor:
          name: Capteur « Fin de matinée »
          description: >-
            L'entité `morning_end` de l'élève. L'identifiant d'entité dépend de
            la langue d'installation de Home Assistant (`..._fin_de_matinee` en
            français, `..._end_of_morning` en anglais), c'est pourquoi ce
            blueprint le fait choisir. Prenez bien « Fin de matinée », pas
            « Fin des cours » ni « Prochain cours ».
          selector:
            entity:
              filter:
                integration: carnet_scolaire
                domain: sensor
                device_class: timestamp
    reglages:
      name: Réglages
      icon: mdi:tune
      collapsed: true
      input:
        include_cancellations:
          name: Tenir compte des cours annulés (professeur absent)
          description: >-
            Activé : l'action part quand la matinée finit vraiment, plus tôt si
            les derniers cours du matin sont annulés. Désactivé : l'action part
            à l'heure prévue par l'emploi du temps, pour un élève qui reste en
            permanence quand un professeur est absent ; si la grille ne
            prévoyait aucune pause du midi ce jour-là, rien ne se passe.
          default: true
          selector:
            boolean:
        offset:
          name: Écart
          description: >-
            S'ajoute à l'heure de fin de matinée. Négatif pour partir avant la
            sonnerie, positif pour laisser le temps du trajet.
          default:
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:
              allow_negative: true
        earliest_time:
          name: Pas avant
          description: >-
            Garde-fou : un emploi du temps aberrant ne doit pas déclencher
            l'action au milieu de la nuit.
          default: "09:00:00"
          selector:
            time:
        latest_time:
          name: Pas après
          description: >-
            Garde-fou symétrique : passée cette heure, un retour du midi n'est
            plus vraisemblable.
          default: "15:00:00"
          selector:
            time:
    retour:
      name: Retour
      icon: mdi:home-import-outline
      input:
        midday_action:
          name: Action à la fin de la matinée
          description: >-
            Ce qu'il faut faire. Les variables `title` et `message` sont
            disponibles ; `message` dit l'heure de sortie, l'heure de reprise
            et, le cas échéant, combien de cours ont été annulés.
          selector:
            action:

# `single` : la fin de matinée arrive une fois par jour. L'attente de l'heure
# prévue fait partie de la même exécution.
mode: single

triggers:
  - alias: À l'heure de fin de matinée publiée par l'intégration
    trigger: time
    at:
      entity_id: !input morning_end_sensor
      offset: !input offset

conditions:
  - alias: Dans la plage horaire autorisée
    condition: time
    after: !input earliest_time
    before: !input latest_time
  # Quand les annulations ne comptent pas, il faut une fin de matinée prévue :
  # sans elle, la grille ne prévoyait pas de retour du midi ce jour-là.
  - alias: Une fin de matinée prévue existe, si les annulations ne comptent pas
    condition: template
    value_template: "{{ include_cancellations or has_scheduled_end }}"

variables:
  include_cancellations: !input include_cancellations
  end_sensor: !input morning_end_sensor
  # Les seuls templates du fichier : ils composent un texte et mesurent
  # l'attente, parce qu'aucun déclencheur natif ne sait viser un attribut.
  # Chaque variable relit le capteur : Home Assistant rend une variable en
  # texte, donc un instant ne passe pas d'une variable à la suivante.
  has_scheduled_end: "{{ state_attr(end_sensor, 'scheduled_end') is not none }}"
  wait_seconds: >-
    {% set actual = states(end_sensor) | as_datetime(none) %}
    {% set scheduled = state_attr(end_sensor, 'scheduled_end') | as_datetime(none) %}
    {{ 0 if include_cancellations or actual is none or scheduled is none
       else [0, (scheduled - actual).total_seconds()] | max | int }}
  canceled: "{{ state_attr(end_sensor, 'canceled_before_break') | int(0) }}"
  end_at: >-
    {% set raw = states(end_sensor) if include_cancellations
       else state_attr(end_sensor, 'scheduled_end') %}
    {% set t = raw | as_datetime(none) %}
    {{ (t | as_local).strftime('%H:%M') if t is not none else '?' }}
  resumes_at: >-
    {% set t = state_attr(end_sensor, 'resumes_at') | as_datetime(none) %}
    {{ (t | as_local).strftime('%H:%M') if t is not none else '' }}
  title: Retour du midi
  message: >-
    Fin de matinée à {{ end_at }}.
    {%- if include_cancellations and canceled | int > 0 %}
    {{ canceled }} cours annulé{{ 's' if canceled | int > 1 }} en fin de matinée.
    {%- endif %}
    {%- if resumes_at %}
    Reprise à {{ resumes_at }}.
    {%- endif %}

actions:
  - alias: Attendre l'heure prévue, si les annulations ne comptent pas
    if:
      - condition: template
        value_template: "{{ wait_seconds | int > 0 }}"
    then:
      - delay:
          seconds: "{{ wait_seconds | int }}"
  - alias: Exécuter l'action choisie
    sequence: !input midday_action
